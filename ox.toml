# ox.toml - ox deploy manifest for oxzoo-php-vue.
# nginx serves dist/ from the current release (spa = true) and proxies only
# /api and /health to the web process, which is PHP's built-in server
# running router.php from the release root. Plain PHP, no Composer.

name = "oxzoo-php-vue"
branch = "main"
runtime = "executable"
framework = "generic"
package_manager = ""
port = 9112
environment_file = "/etc/ox/apps/oxzoo-php-vue.env"

required_packages = ["nodejs", "php-cli"]

[[apt_sources]]
name = "nodesource"
url = "https://deb.nodesource.com/node_22.x"
suite = "nodistro"
components = ["main"]
key_url = "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"

[frontend]
dist = "dist"
api_paths = ["/api", "/health"]

[[processes]]
name = "web"
command = "php -S 127.0.0.1:{port} router.php"
readiness = "http://127.0.0.1:{port}/health"

[deploy]
install = ["npm", "install"]
build = ["npm", "run", "build"]
health_url = "http://127.0.0.1:9112/health"

[[domains]]
name = "php-vue.oxzoo.sorv.dev"
tls = true
spa = true
